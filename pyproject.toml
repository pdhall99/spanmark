# [build-system]
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# --------------------------------------------------------------------------------------
# [project]
[project]
name = "spanmark"
dynamic = ["version"]
description = "A lightweight span-annotation widget for interactive Python environments"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "annotation",
    "anywidget",
    "data labeling",
    "data labelling",
    "human in the loop",
    "information extraction",
    "jupyter",
    "named entity recognition",
    "ner",
    "nlp",
    "notebook",
    "sequence labeling",
    "sequence labelling",
    "span annotation",
    "text annotation",
    "text labeling",
    "text labelling",
    "widget",
]
authors = [
    { name = "PD Hall", email = "20580126+pdhall99@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anywidget",
    "filelock>=3.16",
    "ipython",
    "traitlets",
    "typing-extensions",
]

[project.urls]
Homepage = "https://github.com/pdhall99/spanmark"
Documentation = "https://github.com/pdhall99/spanmark/blob/main/README.md"
Source = "https://github.com/pdhall99/spanmark"
Issues = "https://github.com/pdhall99/spanmark/issues"
Changelog = "https://github.com/pdhall99/spanmark/blob/main/docs/CHANGELOG.md"

# --------------------------------------------------------------------------------------
# [dependency-groups]
[dependency-groups]
check-code = ["ruff==0.16.6"] # keep consistent with pre-commit-config.yaml
check-fmt = [{ "include-group" = "check-code" }]
check-types = ["pyrefly==1.2.0", { "include-group" = "test" }]
dev = [
    { "include-group" = "check-code" },
    { "include-group" = "check-fmt" },
    { "include-group" = "check-types" },
    { "include-group" = "test" },
]
test = [
    "coverage-enable-subprocess==1.0",
    "coverage[toml]~=7.11",
    "pytest~=9.0",
    "pytest-mock~=3.12",
    "pytest-randomly~=4.1",
    "pytest-rerunfailures~=16.0",
    "pytest-sugar",
    "pytest-xdist[psutil]~=3.5",
]

# --------------------------------------------------------------------------------------
# [tool.coverage]
[tool.coverage.run]
source_pkgs = ["spanmark"]
omit = ["*/_version.py"]
branch = true
parallel = true

[tool.coverage.paths]
spanmark = ["src/spanmark", "*/site-packages/spanmark"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if 0:",
    "raise NotImplementedError",
    "raise AssertionError",
    "if self\\.debug",
    ".*\\.\\.\\.$",
]

# --------------------------------------------------------------------------------------
# [tool.hatch]
[tool.hatch.build.hooks.vcs]
version-file = "src/spanmark/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/spanmark"]

[tool.hatch.envs.default]
python = "3.10"
installer = "uv"
dependencies = []

[tool.hatch.envs.dev]
dependency-groups = ["dev"]
post-install-commands = ["hatch run pre-commit:install"]
dependencies = []

[tool.hatch.envs.hatch-check-code]
config-path = "pyproject.toml"
dependency-groups = ["check-code"]
dependencies = []

[tool.hatch.envs.hatch-check-fmt]
config-path = "pyproject.toml"
dependency-groups = ["check-fmt"]
dependencies = []

[tool.hatch.envs.hatch-check-types]
python = "3.10"
config-path = "pyproject.toml"
dependency-groups = ["check-types"]
dependencies = []

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
dependencies = []

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = ["coverage report {args}", "coverage html"]
cov-report-markdown = "coverage report --format=markdown"

[tool.hatch.envs.notebook]
dependencies = ["anywidget", "ipywidgets", "jupyterlab", "pip"]

[tool.hatch.envs.notebook.scripts]
lab = "jupyter lab"

[tool.hatch.envs.pre-commit]
detached = true
skip-install = true
dependencies = ["pre-commit"]

[tool.hatch.envs.pre-commit.scripts]
install = "pre-commit install"
run = "pre-commit run --all {args}"
ci = "pre-commit run --all-files"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

# --------------------------------------------------------------------------------------
# [tool.pyrefly]
[tool.pyrefly]
python-version = "3.10"
preset = "strict"
project-includes = ["src/spanmark", "tests"]
search-path = ["src"]
disable-search-path-heuristics = true
errors = { implicit-any-lambda = "ignore" }

# --------------------------------------------------------------------------------------
# [tool.pytest]
[tool.pytest.ini_options]
addopts = "-ra -q --doctest-glob='*.md'"
testpaths = ["README.md", "tests"]

# --------------------------------------------------------------------------------------
# [tool.ruff]
[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
src = ["src"]
include = ["scripts/**/*.py", "src/**/*.py", "src/**/*.pyi", "tests/**/*.py"]
exclude = ["**/_version.py"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "W"]
ignore = [
    "D1",
    "D205",
    "E203",
    # Below as recommended at https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "D203",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "W191",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
