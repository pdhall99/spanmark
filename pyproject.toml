# [build-system]
[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

# --------------------------------------------------------------------------------------
# [project]
[project]
name = "spanmark"
description = "A lightweight span-annotation widget for interactive Python environments"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
    "annotation",
    "anywidget",
    "data labeling",
    "data labelling",
    "human in the loop",
    "information extraction",
    "jupyter",
    "named entity recognition",
    "ner",
    "nlp",
    "notebook",
    "sequence labeling",
    "sequence labelling",
    "span annotation",
    "text annotation",
    "text labeling",
    "text labelling",
    "widget",
]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
    "anywidget",
    "filelock>=3.16",
    "ipython",
    "traitlets",
]

[[project.authors]]
name = "PD Hall"
email = "20580126+pdhall99@users.noreply.github.com"

[project.urls]
Homepage = "https://github.com/pdhall99/spanmark"
Documentation = "https://github.com/pdhall99/spanmark/blob/main/README.md"
Source = "https://github.com/pdhall99/spanmark"
Issues = "https://github.com/pdhall99/spanmark/issues"
Changelog = "https://github.com/pdhall99/spanmark/blob/main/docs/CHANGELOG.md"

# --------------------------------------------------------------------------------------
# [dependency-groups]
[dependency-groups]
dev = [
    { include-group = "check-code" },
    { include-group = "check-fmt" },
    { include-group = "check-types" },
    { include-group = "test" },
]
test = [
    "coverage[toml]~=7.11",
    "coverage-enable-subprocess==1",
    "pytest~=9.0",
    "pytest-mock~=3.12",
    "pytest-randomly~=4.1",
    "pytest-rerunfailures~=16.0",
    "pytest-sugar",
    "pytest-xdist[psutil]~=3.5",
]
check-code = [ "ruff==0.17.1" ]  # keep consistent with pre-commit-config.yaml
check-fmt = [ { include-group = "check-code" } ]
check-types = [ "pyrefly==1.4", { include-group = "test" } ]

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

# --------------------------------------------------------------------------------------
# [tool.hatch]
[tool.hatch.build.hooks.vcs]
version-file = "src/spanmark/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [ ".github" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/spanmark" ]

[tool.hatch.envs.default]
python = "3.11"
installer = "uv"
dependencies = []

[tool.hatch.envs.dev]
dependencies = []
post-install-commands = [ "hatch run pre-commit:install" ]
dependency-groups = [ "dev" ]

[tool.hatch.envs.hatch-check-code]
dependencies = []
config-path = "pyproject.toml"
dependency-groups = [ "check-code" ]

[tool.hatch.envs.hatch-check-fmt]
dependencies = []
config-path = "pyproject.toml"
dependency-groups = [ "check-fmt" ]

[tool.hatch.envs.hatch-check-types]
python = "3.11"
dependencies = []
config-path = "pyproject.toml"
dependency-groups = [ "check-types" ]

[tool.hatch.envs.hatch-test]
dependencies = []
dependency-groups = [ "test" ]

[[tool.hatch.envs.hatch-test.matrix]]
python = [ "3.11", "3.12", "3.13", "3.14", "3.15" ]

[tool.hatch.envs.hatch-test.scripts]
cov-combine = "coverage combine"
cov-report = [ "coverage report {args}", "coverage html" ]
cov-report-markdown = "coverage report --format=markdown"
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"

[tool.hatch.envs.notebook]
dependencies = [ "anywidget", "ipywidgets", "jupyterlab", "pip" ]

[tool.hatch.envs.notebook.scripts]
lab = "jupyter lab"

[tool.hatch.envs.pre-commit]
detached = true
skip-install = true
dependencies = [ "pre-commit" ]

[tool.hatch.envs.pre-commit.scripts]
ci = "pre-commit run --all-files"
install = "pre-commit install"
run = "pre-commit run --all {args}"

# --------------------------------------------------------------------------------------
# [tool.ruff]
[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
src = [ "src" ]
include = [ "scripts/**/*.py", "src/**/*.py", "src/**/*.pyi", "tests/**/*.py" ]
exclude = [ "**/_version.py" ]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "F401" ]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "D", "E", "F", "I", "UP", "W" ]
ignore = [
    "D1",
    # Below as recommended at https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "D203",
    "D205",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E203",
    "E501",
    "W191",
]

# --------------------------------------------------------------------------------------
# [tool.pyproject-fmt]
[tool.pyproject-fmt]
column_width = 88
indent = 4
keep_full_version = false
generate_python_version_classifiers = false
max_supported_python = "3.14"
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n"
expand_tables = []
collapse_tables = []
skip_wrap_for_keys = []

# --------------------------------------------------------------------------------------
# [tool.pyrefly]
[tool.pyrefly]
python-version = "3.11"
project-includes = [ "src/spanmark", "tests" ]
search-path = [ "src" ]
errors = { implicit-any-lambda = "ignore" }
disable-search-path-heuristics = true
preset = "strict"

# --------------------------------------------------------------------------------------
# [tool.pytest]
[tool.pytest.ini_options]
testpaths = [ "README.md", "tests" ]
addopts = "-ra -q --doctest-glob='*.md'"

# --------------------------------------------------------------------------------------
# [tool.coverage]
[tool.coverage.run]
source_pkgs = [ "spanmark" ]
omit = [ "*/_version.py" ]
branch = true
parallel = true

[tool.coverage.paths]
spanmark = [ "src/spanmark", "*/site-packages/spanmark" ]

[tool.coverage.report]
exclude_lines = [
    ".*\\.\\.\\.$",
    "if __name__ == .__main__.:",
    "if 0:",
    "if self\\.debug",
    "if TYPE_CHECKING:",
    "no cov",
    "raise AssertionError",
    "raise NotImplementedError",
]
