version: 2

# Each update waits a week before proposing a new release (cooldown), so a
# compromised release has time to be noticed before it reaches the project.
updates:
  # Workflow actions are pinned to commit SHAs with version comments, which
  # Dependabot updates together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # When this bumps ruff-pre-commit, bump ruff in pyproject.toml's check-code
  # group to the same version in the same pull request.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
